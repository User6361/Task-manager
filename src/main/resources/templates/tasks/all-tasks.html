<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>All Tasks - Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>


        /* Дополнительные стили для красивого отображения */
        .nav-link {
            padding-right: 2rem !important;
        }
        /* LOW — зелёный */
        .priority-badge[data-priority="LOW"] {
            background-color: #28a745 !important;
        }

        /* MEDIUM — жёлтый */
        .priority-badge[data-priority="MEDIUM"] {
            background-color: #ffc107 !important;
            color: black !important;
        }

        /* HIGH — красный */
        .priority-badge[data-priority="HIGH"] {
            background-color: #dc3545 !important;
        }

        /* URGENT — бордовый/фиолетовый */
        .priority-badge[data-priority="URGENT"] {
            background-color: #6f1d1b !important; /* красивый бордовый */
        }
        body {
            padding-top: 56px; /* или 60px для запаса */
        }

    </style>
</head>
<body>
<!-- НАВИГАЦИОННАЯ ПАНЕЛЬ -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/tasks">Task Manager</a>
        <span class="navbar-text me-3" sec:authorize="isAuthenticated()">
                Welcome, <span th:text="${currentUser.getFullName()}"></span>
        </span>
        <div class="navbar-nav ms-auto">
            <div class="d-flex align-items-center gap-3">
                <a class="nav-link text-white" href="/tasks">All Tasks</a>
                <a class="nav-link text-white position-relative" href="/tasks/my-tasks">
                    My Tasks
                    <span th:if="${countOfMyTasksMessage > 0}"
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                          style="font-size: 0.6rem;"
                          th:text="${countOfMyTasksMessage}">
                    </span>
                </a>
                <a class="nav-link text-white" href="/info">Info</a>
                <a class="nav-link text-white" href="/tasks/find-tasks">Find task</a>
                <a class="nav-link text-white" href="/users">Users</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>




<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>All Tasks</h2>
    </div>

    <!-- Форма создания новой задачи -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Create New Task</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/tasks}" method="post" th:if="${currentUserRoles.stream().anyMatch()}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="title" class="form-label">Task Title</label>
                        <input type="text" class="form-control" id="title" name="title"
                               placeholder="Enter task title" required>
                    </div>
                    <div class="col-md-4">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" class="form-control" id="description" name="description"
                               placeholder="Enter description">
                    </div>
                    <div class="col-md-2">
                        <label for="priority" class="form-label">Priority</label>
                        <select name="priority" id="priority" class="form-select">
                            <option value="LOW" selected>Low</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="HIGH">High</option>
                            <option value="URGENT">Urgent</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Create Task</button>
                    </div>
                </div>
            </form>

            <!-- Сообщение для не-администраторов -->
            <div th:unless="${currentUser.role.name() == 'ADMINISTRATOR'}" class="alert alert-info">
                Only administrators can create new tasks.
            </div>
        </div>
    </div>

    <!-- Список задач -->
    <div th:if="${not #lists.isEmpty(tasks)}">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Task List</h4>
            <span class="badge bg-secondary" th:text="${#lists.size(tasks)} + ' tasks'"></span>
        </div>

        <div th:each="task : ${tasks}" class="card mb-3">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h5 class="card-title" th:text="${task.title}"></h5>
                        <p class="card-text text-muted" th:text="${task.description} ?: 'No description'"></p>
                        <p class="text-muted-2" th:text="'Task ID: ' + ${task.getId()}"></p>
                        <div class="d-flex gap-2 align-items-center">
                            <span class="badge priority-badge"
                                  th:attr="data-priority=${task.priority}"
                                  th:text="${task.priority}">
                            </span>
                            <span class="badge bg-info" th:text="${task.status}"></span>
                            <small class="text-muted" th:text="'Created: ' + ${task.getCreateDate()}"></small>
                            <small class="text-muted" th:text="'Updated: ' + ${task.getUpdatedDate()}"></small>

                        </div>
                        <div>
                            <small class="text-muted" th:text="'Deadline: ' + ${task.deadline}"></small>
                            <p class="badge" th:class="'badge bg-' + ${task.deadlineColor}">

                                <span th:if="${task.status.name() == 'COMPLETED'}">Task completed</span>

                                <span th:if="${task.status.name() != 'COMPLETED' and task.daysLeft == 0}">Expired</span>

                                <span th:if="${task.status.name() != 'COMPLETED' and task.daysLeft != 0}"
                                      th:text="${task.daysLeft} + ' days left'"></span>
                            </p>
                        </div>
                    </div>


                    <div class="col-md-4">
                        <div th:if="${task.assignee}" class="mb-2">
                            <strong>Assigned to:</strong>
                            <span th:text="${task.assignee.getFullName()}"></span>
                        </div>
                        <div th:unless="${task.assignee}" class="mb-2">
                            <span class="text-warning">Unassigned</span>
                        </div>

                        <!-- Форма назначения задачи -->
                        <form th:action="@{/tasks/{taskId}/assign(taskId=${task.id})}"
                              method="post" class="row g-2">

                            <div class="col-12 mb-2">
                                <small class="text-muted d-block mb-1">Assignee</small>
                                <select name="assigneeId" class="form-select form-select-sm"
                                        th:disabled="${currentUser.role.name() != 'ADMINISTRATOR'}">
                                    <th:block th:if="${task.assignee == null}">
                                        <option value="">Select user to assign...</option>
                                        <option th:each="user : ${users}"
                                                th:value="${user.id}"
                                                th:text="${user.fullName}">
                                        </option>
                                    </th:block>

                                    <th:block th:if="${task.assignee != null}">
                                        <option th:value="${task.assignee.id}"
                                                th:text="'Currently: ' + ${task.assignee.fullName}"
                                                selected>
                                        </option>

                                        <option th:each="user : ${users}"
                                                th:if="${user.id != task.assignee.id}"
                                                th:value="${user.id}"
                                                th:text="'Reassign to: ' + ${user.fullName}">
                                        </option>

                                        <option value="" class="text-warning">⚠ Unassign this task</option>
                                    </th:block>
                                </select>
                            </div>

                            <div class="col-12 mb-2">
                                <small class="text-muted d-block mb-1">Priority</small>
                                <select name="priority" class="form-select form-select-sm"
                                        th:disabled="${currentUser.role.name() != 'ADMINISTRATOR'}">
                                    <option value="LOW" th:selected="${task.priority.name() == 'LOW'}">LOW</option>
                                    <option value="MEDIUM" th:selected="${task.priority.name() == 'MEDIUM'}">MEDIUM</option>
                                    <option value="HIGH" th:selected="${task.priority.name() == 'HIGH'}">HIGH</option>
                                    <option value="URGENT" th:selected="${task.priority.name() == 'URGENT'}">URGENT</option>
                                </select>
                            </div>
                            <div class="col-12 mb-2">
                                <small class="text-muted d-block mb-1">Status</small>
                                <select name="status" class="form-select form-select-sm"
                                        th:disabled="${currentUser.role.name() != 'ADMINISTRATOR' && (task.assignee == null || !currentUser.getId().equals(task.assignee.id))}">
                                    <option value="OPEN" th:selected="${task.status.name() == 'OPEN'}">OPEN</option>
                                    <option value="IN_PROGRESS" th:selected="${task.status.name() == 'IN_PROGRESS'}">IN PROGRESS</option>
                                    <option value="COMPLETED" th:selected="${task.status.name() == 'COMPLETED'}">COMPLETED</option>
                                </select>
                            </div>

                            <!-- Кнопка Update -->
                            <div class="col-12"
                                 th:if="${currentUser.role.name() == 'ADMINISTRATOR' || (task.assignee != null && currentUser.getId().equals(task.assignee.id))}">
                                <button type="submit" class="btn btn-sm btn-outline-success w-100">
                                    Update
                                </button>
                            </div>
                        </form>

                        <!-- Кнопка Delete отдельной формой -->
                        <div th:if="${currentUser.role.name() == 'ADMINISTRATOR'}" class="mt-2">
                            <form th:action="@{/tasks/{taskId}/delete(taskId=${task.id})}"
                                  method="post" class="d-inline w-100">
                                <button type="submit" class="btn btn-sm btn-outline-danger w-100"
                                        onclick="return confirm('Are you sure you want to delete this task?')">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Сообщение если задач нет -->
    <div th:if="${#lists.isEmpty(tasks)}" class="alert alert-info text-center">
        <h5>No tasks found</h5>
        <p class="mb-0">Create your first task using the form above!</p>
    </div>
</div>
</body>
</html>
