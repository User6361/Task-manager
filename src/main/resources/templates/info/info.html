<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Info</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    .nav-link {
        padding-right: 2rem !important;
    }
    .hover-shadow:hover {
        box-shadow: 0 0 10px rgba(0,123,255,0.2);
        background-color: rgba(0,123,255,0.05);
    }
    body {
        padding-top: 56px; /* или 60px для запаса */
    }

</style>

<body>
<!-- НАВИГАЦИОННАЯ ПАНЕЛЬ -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/tasks">Task Manager</a>
        <span class="navbar-text me-3" sec:authorize="isAuthenticated()">
                Welcome, <span th:text="${currentUser.getFullName()}"></span>
        </span>
        <div class="navbar-nav ms-auto">
            <div class="d-flex align-items-center gap-3">
                <a class="nav-link text-white" href="/tasks">All Tasks</a>
                <a class="nav-link text-white position-relative" href="/tasks/my-tasks">
                    My Tasks
                    <span th:if="${countOfMyTasksMessage > 0}"
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                          style="font-size: 0.6rem;"
                          th:text="${countOfMyTasksMessage}">
                    </span>
                </a>
                <a class="nav-link text-white" href="/info">Info</a>
                <a class="nav-link text-white" href="/tasks/find-tasks">Find task</a>
                <a class="nav-link text-white" href="/users">Users</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">Info</h2>
    <form th:action="@{/info/unassigned}" method="get" class="d-inline">
        <button type="submit" class="btn btn-link text-decoration-none p-0 border-0 bg-transparent">
            <div class="mb-2 p-2 rounded hover-shadow" style="cursor: pointer; transition: all 0.3s;">
                <span class="text-primary fw-bold">
                    <i class="bi bi-list-task me-1"></i>
                    Total Unassigned:
                </span>
                <span class="badge bg-primary ms-2">
                    <span th:text="${#lists.size(unassigneTasks)}">0</span>
                </span>
            </div>
        </button>
    </form>

    <div th:if="${not #lists.isEmpty(users)}">
        <div th:each="user : ${users}" class="card mb-3">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="user_info">
                            <h4 th:text="${user.getFullName()}"></h4>
                            <p><strong>ID:</strong> <span th:text="${user.getId()}"></span></p>
                            <p><strong>Username:</strong> <span th:text="${user.getUsername()}"></span></p>
                            <p><strong>Email:</strong> <span th:text="${user.getEmail()}"></span></p>
                        </div>
                    </div>


                    <div class="col-md-6">
                        <div class="info_of_user">
                            <div class="task-stats">

                                <form th:action="@{/info/total/{userId}(userId=${user.id})}" method="get" class="d-inline">
                                    <button type="submit" class="btn btn-link text-decoration-none p-0 border-0 bg-transparent">
                                        <div class="mb-2 p-2 rounded hover-shadow" style="cursor: pointer; transition: all 0.3s;">
                                            <span class="text-primary fw-bold">
                                                <i class="bi bi-list-task me-1"></i>
                                                Total:
                                            </span>
                                            <span class="badge bg-primary ms-2">
                                                <span th:text="${user.assignedTasks != null ? #lists.size(user.assignedTasks) : 0}">0</span>
                                            </span>
                                        </div>
                                    </button>
                                </form>

                                <form th:action="@{/info/completed/{userId}(userId=${user.id})}" method="get" class="d-inline">
                                    <input type="hidden" name="status" value="COMPLETED">
                                    <button type="submit" class="btn btn-link text-decoration-none p-0 border-0 bg-transparent">
                                        <div class="mb-2 p-2 rounded hover-shadow" style="cursor: pointer; transition: all 0.3s;">
                                            <span class="text-primary fw-bold">
                                                <i class="bi bi-check-circle me-1"></i>
                                                Completed:
                                            </span>
                                            <span class="badge bg-primary ms-2">
                                                <span th:text="${user.getCountOfTasksWithСertainStatus(T(com.main.taskmanager.task.model.enumclasses.TaskStatus).COMPLETED)}">0</span>
                                            </span>
                                        </div>
                                    </button>
                                </form>



                                <form th:action="@{/info/in-progress/{userId}(userId=${user.id})}" method="get" class="d-inline">
                                    <input type="hidden" name="status" value="IN_PROGRESS">
                                    <button type="submit" class="btn btn-link text-decoration-none p-0 border-0 bg-transparent">
                                        <div class="mb-2 p-2 rounded hover-shadow" style="cursor: pointer; transition: all 0.3s;">
                                            <span class="text-success fw-bold">
                                                <i class="bi bi-check-circle me-1"></i>
                                                In progress:
                                            </span>
                                            <span class="badge bg-success ms-2">
                                                <span th:text="${user.getCountOfTasksWithСertainStatus(T(com.main.taskmanager.task.model.enumclasses.TaskStatus).IN_PROGRESS)}">0</span>
                                            </span>
                                        </div>
                                    </button>
                                </form>

                                <form th:action="@{/info/open/{userId}(userId=${user.id})}" method="get" class="d-inline">
                                    <input type="hidden" name="status" value="OPEN">
                                    <button type="submit" class="btn btn-link text-decoration-none p-0 border-0 bg-transparent">
                                        <div class="mb-2 p-2 rounded hover-shadow" style="cursor: pointer; transition: all 0.3s;">
                                            <span class="text-success fw-bold">
                                                <i class="bi bi-check-circle me-1"></i>
                                                Open:
                                            </span>
                                            <span class="badge bg-success ms-2">
                                                <span th:text="${user.getCountOfTasksWithСertainStatus(T(com.main.taskmanager.task.model.enumclasses.TaskStatus).OPEN)}">0</span>
                                            </span>
                                        </div>
                                    </button>
                                </form>
                                <div class="md-2">
                                    <span th:if="${user.getUserTasksWithHighPriority() == 0}" class="text-info ms-2" th:text="'No high priority tasks'"></span>
                                    <span th:if="${user.getUserTasksWithHighPriority() > 0}"
                                          class="badge bg-warning ms-2"
                                          th:text="'High priority: ' + ${user.getUserTasksWithHighPriority()}"></span>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(users)}" class="alert alert-info text-center py-4">
        <h5>No info</h5>
        <p class="mb-2">You don't have any info of tasks and users</p>
        <a href="/tasks" class="btn btn-primary btn-sm">Browse All Tasks</a>
    </div>
</div>

</body>
</html>
