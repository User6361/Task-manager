<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>All Users - Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        body {
            padding-top: 70px;
        }


        .hover-shadow:hover {
            box-shadow: 0 0 10px rgba(0,123,255,0.2);
            background-color: rgba(0,123,255,0.05);
        }

        /* ... (Остальные стили приоритетов и nav-link) ... */
        .nav-link {
            padding-right: 2rem !important;
        }
        /* LOW — зелёный */
        .priority-badge[data-priority="LOW"] {
            background-color: #28a745 !important;
        }

        /* MEDIUM — жёлтый */
        .priority-badge[data-priority="MEDIUM"] {
            background-color: #ffc107 !important;
            color: black !important;
        }

        /* HIGH — красный */
        .priority-badge[data-priority="HIGH"] {
            background-color: #dc3545 !important;
        }

        /* URGENT — бордовый/фиолетовый */
        .priority-badge[data-priority="URGENT"] {
            background-color: #6f1d1b !important;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/tasks">Task Manager</a>
        <span class="navbar-text me-3" sec:authorize="isAuthenticated()">
                Welcome, <span th:text="${currentUser.getFullName()}"></span>
        </span>
        <div class="navbar-nav ms-auto">
            <div class="d-flex align-items-center gap-3">
                <a class="nav-link text-white" href="/tasks">All Tasks</a>
                <a class="nav-link text-white position-relative" href="/tasks/my-tasks">
                    My Tasks
                    <span th:if="${countOfMyTasksMessage > 0}"
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                          style="font-size: 0.6rem;"
                          th:text="${countOfMyTasksMessage}">
                    </span>
                </a>
                <a class="nav-link text-white" href="/info">Info</a>
                <a class="nav-link text-white" href="/tasks/find-tasks">Find task</a>
                <a class="nav-link text-white" href="/users">Users</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="mb-4">All Users</h2>
    <form
            th:action="@{/users/create}"
            th:if="${currentUser.getRole().name() == 'ADMINISTRATOR'}"
            method="get"
            class="d-inline">
        <button type="submit" class="btn btn-link text-decoration-none p-0 border-0 bg-transparent">
            <div class="mb-2 p-2 rounded hover-shadow" style="cursor: pointer; transition: all 0.3s;">
        <span class="text-primary fw-bold fs-5">
            <i class="bi bi-list-task me-1"></i>
            Create User
        </span>
            </div>
        </button>
    </form>

    <div th:if="${not #lists.isEmpty(users)}">

        <a th:each="user : ${users}"
           th:href="@{/users/{userId}(userId=${user.id})}"
           class="card mb-3 text-decoration-none text-dark"
           style="transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,.05);">

            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="user_info">
                            <h4 class="card-title" th:text="${user.getFullName()}"></h4>
                            <p class="card-text"><strong>ID:</strong> <span th:text="${user.getId()}"></span></p>
                            <p class="card-text"><strong>Username:</strong> <span th:text="${user.getUsername()}"></span></p>
                            <p class="card-text"><strong>Email:</strong> <span th:text="${user.getEmail()}"></span></p>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="info_of_user">
                            <div class="task-stats">
                                <span class="text-muted">Нажмите, чтобы увидеть статистику</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </a>
    </div>
</div>
</body>
</html>
