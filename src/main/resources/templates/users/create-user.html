<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create User - Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>

    body {
        padding-top: 70px;
    }


    .hover-shadow:hover {
        box-shadow: 0 0 10px rgba(0,123,255,0.2);
        background-color: rgba(0,123,255,0.05);
    }

    /* ... (Остальные стили приоритетов и nav-link) ... */
    .nav-link {
        padding-right: 2rem !important;
    }
    /* LOW — зелёный */
    .priority-badge[data-priority="LOW"] {
        background-color: #28a745 !important;
    }

    /* MEDIUM — жёлтый */
    .priority-badge[data-priority="MEDIUM"] {
        background-color: #ffc107 !important;
        color: black !important;
    }

    /* HIGH — красный */
    .priority-badge[data-priority="HIGH"] {
        background-color: #dc3545 !important;
    }

    /* URGENT — бордовый/фиолетовый */
    .priority-badge[data-priority="URGENT"] {
        background-color: #6f1d1b !important;
    }
</style>
<body class="bg-light pt-5">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/tasks">Task Manager</a>
        <span class="navbar-text me-3" sec:authorize="isAuthenticated()">
                Welcome, <span th:text="${currentUser.getFullName()}"></span>
        </span>
        <div class="navbar-nav ms-auto">
            <div class="d-flex align-items-center gap-3">
                <a class="nav-link text-white" href="/tasks">All Tasks</a>
                <a class="nav-link text-white position-relative" href="/tasks/my-tasks">
                    My Tasks
                    <span th:if="${countOfMyTasksMessage > 0}"
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                          style="font-size: 0.6rem;"
                          th:text="${countOfMyTasksMessage}">
                    </span>
                </a>
                <a class="nav-link text-white" href="/info">Info</a>
                <a class="nav-link text-white" href="/tasks/find-tasks">Find task</a>
                <a class="nav-link text-white" href="/users">Users</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Create New User (Admin Panel)</h2>

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

                    <form th:action="@{/users/create}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email">
                        </div>
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" name="fullName">
                        </div>
                        <div class="mb-4">
                            <label for="role" class="form-label">Role</label>
                            <select class="form-select" id="role" name="role" required>
                                <option th:each="role : ${roles}"
                                        th:value="${role}"
                                        th:text="${role}">USER</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Create User</button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/users}">Back to Users List</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
